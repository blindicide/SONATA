[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sonata-archiver"
version = "0.1.1"
description = "SONATA — a local multimedia downloader and archival manager"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{name = "SONATA contributors"}]
dependencies = ["PySide6-Essentials==6.8.3"]
classifiers = ["Development Status :: 3 - Alpha", "Environment :: X11 Applications :: Qt", "Operating System :: Microsoft :: Windows :: Windows 10", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3", "pyinstaller==6.22.3"]

[project.gui-scripts]
sonata = "sonata.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
