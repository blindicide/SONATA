name: Package downloads
on:
  push:
    paths: ['.github/workflows/package-downloads.yml']
  workflow_run:
    workflows: ['Test and build']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  split-linux:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SONATA-Linux-x64
          path: packages
          run-id: ${{ github.event.workflow_run.id || '41316533412' }}
          github-token: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: SONATA-Linux-portable
          path: |
            packages/*.tar.gz
            packages/SHA256SUMS*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: SONATA-Linux-DEB
          path: |
            packages/*.deb
            packages/SHA256SUMS*
          if-no-files-found: error
