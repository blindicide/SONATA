name: Test and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      SONATA_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src scripts tests
      - run: python scripts/fetch_tools.py
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm packaging/sonata.spec
      - run: python scripts/package.py
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: SONATA-${{ runner.os }}-x64
          path: dist/packages/*
          if-no-files-found: error
